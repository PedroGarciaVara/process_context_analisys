name: Architecture validation

on:
  push:
  pull_request:

jobs:
  architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run deterministic architecture validators
        run: |
          python -m uc_bib_solv.architecture_validators --check-structure
          python -m uc_bib_solv.architecture_validators --check-naming
          python -m uc_bib_solv.architecture_validators --check-dependencies
          python -m uc_bib_solv.architecture_validators --check-concrete-implementations
      - name: Run architecture boundary tests
        run: python -m unittest tests.architecture.test_architecture_validators tests.architecture.test_t9_boundaries
